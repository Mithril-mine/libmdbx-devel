on:
  push:
    - workflows: [ci-linux-debug-cxx-on, ci-linux-debug-cxx-off, ci-linux-release-cxx-on, ci-linux-release-cxx-off]
  pull_request:
    - workflows: [ci-linux-debug-cxx-on, ci-linux-debug-cxx-off, ci-linux-release-cxx-on, ci-linux-release-cxx-off]
  schedule:
    - workflows: [ci-linux-debug-cxx-on, ci-linux-debug-cxx-off, ci-linux-release-cxx-on, ci-linux-release-cxx-off]
      cron: "42 3 * * *"
      description: "Ежедневный запуск CI Linux в 03:42 (по умолчанию UTC)"

workflows:
  ci-linux-debug-cxx-on:
    env:
      CI: SourceCraft
      CI_MAKE_TARGET: smoke
      MDBX_BUILD_OPTIONS: "-DMDBX_CHECKING=2 -DMDBX_DEBUG=1"
      MDBX_BUILD_CXX: "YES"
    tasks:
      - name: ci-linux-debug-cxx-on-task
        cubes:
          - name: ci-step
            image: docker.io/library/ubuntu
            script:
              - . tests/ci/ci.sh "-DCMAKE_BUILD_TYPE=Debug|-DMDBX_BUILD_CXX:BOOL=ON"
  ci-linux-debug-cxx-off:
    env:
      CI: SourceCraft
      CI_MAKE_TARGET: smoke
      MDBX_BUILD_OPTIONS: "-DMDBX_CHECKING=2 -DMDBX_DEBUG=1"
      MDBX_BUILD_CXX: "NO"
    tasks:
      - name: ci-linux-debug-cxx-off-task
        cubes:
          - name: ci-step
            image: docker.io/library/ubuntu
            script:
              - . tests/ci/ci.sh "-DCMAKE_BUILD_TYPE=Debug|-DMDBX_BUILD_CXX:BOOL=OFF"
  ci-linux-release-cxx-on:
    env:
      CI: SourceCraft
      CI_MAKE_TARGET: test
      MDBX_BUILD_OPTIONS: "-DMDBX_CHECKING=0 -DMDBX_DEBUG=0"
      MDBX_BUILD_CXX: "YES"
    tasks:
      - name: ci-linux-release-cxx-on-task
        cubes:
          - name: ci-step
            image: docker.io/library/ubuntu
            script:
              - . tests/ci/ci.sh "-DCMAKE_BUILD_TYPE=Release|-DMDBX_BUILD_CXX:BOOL=ON"
  ci-linux-release-cxx-off:
    env:
      CI: SourceCraft
      CI_MAKE_TARGET: test
      MDBX_BUILD_OPTIONS: "-DMDBX_CHECKING=0 -DMDBX_DEBUG=0"
      MDBX_BUILD_CXX: "NO"
    tasks:
      - name: ci-linux-release-cxx-off-task
        cubes:
          - name: ci-step
            image: docker.io/library/ubuntu
            script:
              - . tests/ci/ci.sh "-DCMAKE_BUILD_TYPE=Release|-DMDBX_BUILD_CXX:BOOL=OFF"

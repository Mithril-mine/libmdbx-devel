# Shared base for the unified libmdbx docsite builds (docs/docsite/{en,ru}).
# Locale configs INHERIT this file; relative paths here are resolved against
# the child config's directory. Build (from the repo root): make docsite
# Output: build/docsite/{en,ru}/ (post-processed by normalize_site.py —
# S3-safe flat pages, deduped assets, search index relocation).
#
# Source layout mirrors the deployed URL tree: docs/{ru,en}/<section>/…
# (RU is the canonical original, EN the translation; see
# docs-integration-contract.md §5). The reference API (mkdoxy) is built in
# the EN locale only — see en/mkdocs.yml.

use_directory_urls: false

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  palette:
    # Auto: follow the OS light/dark preference by default; the header toggle
    # lets the reader pin light or dark explicitly.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# attr_list: explicit heading ids (e.g. Cyrillic headings get a stable
# custom anchor instead of an unusable auto-slug)
markdown_extensions:
  - attr_list

hooks:
  - ../hooks/docsite_hooks.py

plugins:
  - search

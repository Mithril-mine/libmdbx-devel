# MkDocs configuration for the Russian libmdbx docsite.
# Build (from the repo root): make docsite  — or manually:
#   mkdocs build -f docs/docsite/ru/mkdocs.yml
# Output: build/docsite/ru/ (post-processed by normalize_site.py)
#
# The RU tree is the canonical original; the API reference and the change log
# are English-only (see the note in reference/index.md), so this build has
# no mkdoxy plugin.

INHERIT: ../base.yml

site_name: Документация libmdbx
site_url: !ENV ${DOCSITE_URL_RU:-https://libmdbx.dqdkfa.ru/docs/ru/}
site_dir: ../../../build/docsite/ru
site_description: >-
  Документация встраиваемой транзакционной БД libmdbx — гайды, учебник,
  погружение во внутренние механизмы и справочник по C/C++ API.
docs_dir: ../../ru

extra:
  locale: ru

nav:
  - Главное: index.md
  - Обзор:
      - Что такое libmdbx: overview/index.md
      - Ограничения и подводные камни: overview/restrictions.md
  - Начало работы:
      - Установка и сборка: getting-started/install-build.md
      - Первые шаги: getting-started/first-steps.md
      - Режимы durability: getting-started/durability-modes.md
  - Учебник:
      - Об учебнике: textbook/index.md
      - Каркас: textbook/00-karkas.md
      - Том I. Основы: textbook/01-tom-i-osnovy.md
      - Том II. Практика: textbook/02-tom-ii-praktika.md
      - Том III. Механизмы: textbook/03-tom-iii-mehanizmy.md
      - Том IV. Производительность: textbook/04-tom-iv-proizvoditelnost.md
      - Том V. Экспертные темы: textbook/05-tom-v-ekspertnye-temy.md
      - Том VI. Биндинги: textbook/06-tom-vi-bindings.md
  - Погружение:
      - Архитектура: deep-dive/architecture.md
      - Внутренние механизмы: deep-dive/internals.md
      - Улучшения относительно LMDB: deep-dive/improvements.md
  - Справочник:
      - Справочник по API: reference/index.md
      - Утилиты командной строки: reference/tooling.md

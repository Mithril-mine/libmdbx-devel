# MkDocs configuration for the English libmdbx docsite.
# Build (from the repo root): make docsite  — or manually:
#   mkdocs build -f docs/docsite/en/mkdocs.yml
# Output: build/docsite/en/ (post-processed by normalize_site.py)
# Prerequisites (prepared by make): docs/mdbx.h docs/mdbx.h++ docs/options.h
# and the generated docs/Doxyfile (consumed by the mkdoxy plugin).

INHERIT: ../base.yml

site_name: libmdbx documentation
site_url: !ENV ${DOCSITE_URL_EN:-https://libmdbx.dqdkfa.ru/docs/en/}
site_dir: ../../../build/docsite/en
site_description: >-
  Documentation for the libmdbx embedded transactional database — guides,
  textbook, internals deep dive, and the C/C++ API reference.
docs_dir: ../../en

extra:
  locale: en

# mkdoxy generates the API reference pages (reference/api/*) from the prepared
# doxygen inputs; all paths are relative to the build CWD (repo root). The
# generated XML is cached in the site dir (assets/.doxy) and stripped by
# normalize_site.py. The API pages are reachable from the reference landing
# (reference/index.md) and cross-linked from the class/function listings;
# keeping them out of the sidebar makes the navigation readable.
plugins:
  - search
  - mkdoxy:
      full-doc: true
      projects:
        api:
          src-dirs: "docs/mdbx.h docs/mdbx.h++ docs/options.h docs/overall.md docs/intro.md docs/usage.md"
          api-path: reference/api
          doxy-cfg-file: "docs/Doxyfile"
          doxy-cfg:
            GENERATE_XML: true
            GENERATE_HTML: false
            GENERATE_LATEX: false
            QUIET: true
            # the mkdoxy plugin runs doxygen from the build CWD (repo root),
            # where the HTML-customization files are not available; HTML is
            # disabled anyway
            HTML_HEADER: ""
            HTML_FOOTER: ""

not_in_nav: |
  reference/api/

nav:
  - Home: index.md
  - Overview:
      - What is libmdbx: overview/index.md
      - Restrictions & gotchas: overview/restrictions.md
  - Getting started:
      - Install & build: getting-started/install-build.md
      - First steps: getting-started/first-steps.md
      - Durability modes: getting-started/durability-modes.md
  - Textbook:
      - About the textbook: textbook/index.md
      - Outline (skeleton): textbook/00-karkas.md
      - Volume I. Fundamentals: textbook/01-tom-i-osnovy.md
      - Volume II. Practice: textbook/02-tom-ii-praktika.md
      - Volume III. Mechanisms: textbook/03-tom-iii-mehanizmy.md
      - Volume IV. Performance: textbook/04-tom-iv-proizvoditelnost.md
      - Volume V. Expert topics: textbook/05-tom-v-ekspertnye-temy.md
      - Volume VI. Bindings: textbook/06-tom-vi-bindings.md
  - Deep dive:
      - Architecture: deep-dive/architecture.md
      - Internals deep dive: deep-dive/internals.md
      - Improvements over LMDB: deep-dive/improvements.md
  - Reference:
      - API reference: reference/index.md
      - Command-line tools: reference/tooling.md
      - Change log: reference/changelog.md

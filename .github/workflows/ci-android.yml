name: ci-android

# Infra v3 platform nightly gate for Android (compact matrix, see
# tests/ci/config.json zones_notes). Runs the android-nightly profile
# (3 build-only cells: NDK r26d/r27d/r29 x oldest/newest ABI surface, plus
# the r27d x86_64 emulator pilot running smoke_basic/smoke_chk via adb).
#
# NDK builds are clang by definition (Bionic toolchain); deeper ABI coverage
# (15 legacy combinations) stays available via ci-dispatch manual profile
# dispatch once re-added to the registry.

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    - cron: "52 3 * * *"
      timezone: "Europe/Moscow"
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.resolve.outputs.cells }}
      ref: ${{ steps.resolve.outputs.ref }}
      scope: ${{ steps.resolve.outputs.scope }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
      - name: resolve cells
        id: resolve
        shell: bash
        env:
          EVENT_REF: ${{ github.event.client_payload.ref }}
        run: |
          set -euo pipefail
          CELLS=$(tests/ci/select-cells.py --profile android-nightly)
          REF="${EVENT_REF:-master}"
          JSON=$(tests/ci/resolve-cells.py "$CELLS" full 2> >(sed 's/^/==> /' >&2) || { echo "resolve-cells failed" >&2; exit 1; })
          echo "cells=${JSON}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "scope=full" >> "$GITHUB_OUTPUT"

  run:
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.cells) }}
    uses: ./.github/workflows/ci-run.yml
    with:
      cell: ${{ matrix.cell }}
      "runs-on": ${{ matrix.runs-on }}
      scope: ${{ matrix.scope }}
      coverage: ${{ matrix.coverage }}
      ndk: ${{ matrix.ndk }}
      ref: ${{ needs.resolve.outputs.ref }}

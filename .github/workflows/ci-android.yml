name: ci-android

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  # See ci-linux.yml: the same gate for pull requests, for this branch
  # and for the nightly schedule.
  pull_request:
  push:
    branches: [stable]
  workflow_dispatch:
  schedule:
    - cron: "42 3 * * *"
      timezone: "Europe/Moscow"
  repository_dispatch:
    types: [dispatch-event]

permissions:
  contents: read

jobs:
  ci-job:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ndk: r27d
            target: arm64-v8a
            build-type: Debug
            os: ubuntu-latest
          - ndk: r29
            target: arm64-v8a
            build-type: Release
            os: ubuntu-latest
          - ndk: r26d
            target: armeabi-v7a with NEON
            build-type: Release
            os: ubuntu-latest
          - ndk: r27d
            target: x86_64
            build-type: Debug
            os: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: true
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: ${{ matrix.ndk }}
        add-to-path: true
    - name: ci-step
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        CI_MAKE_TARGET: ""
      shell: bash
      run: |
        . tests/ci/ci.sh "-DANDROID_ABI=${{ matrix.target }}|-DCMAKE_TOOLCHAIN_FILE:PATH=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake|-DCMAKE_BUILD_TYPE=${{ matrix.build-type }}"

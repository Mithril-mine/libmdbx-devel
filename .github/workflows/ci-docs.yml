name: ci-docs

# Strict audit of the doxygen comments in the public headers (`make
# test-doxygen`): completeness (every documented entity has \brief, \param and
# \returns as required) and correctness (no broken \ref/@copydoc targets).
# Unlike `make docsite`, where the mkdoxy plugin runs doxygen with QUIET and
# discards its output, this job fails on any doxygen warning, so a removed
# \param or a stale reference is caught in CI. See docs/Doxyfile-check.in.
#
# Doxygen >= 1.18 is required (the ubuntu-24.04 apt package is 1.9.8, which
# mis-attaches \param/\returns that follow a \file block and would report
# thousands of false findings; the docsite/mkdoxy also expects >=1.18), so the
# official prebuilt release is downloaded instead of using apt.

on:
  push:
    branches: [devel, master]
  pull_request:
  workflow_dispatch:

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doxygen-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: install doxygen 1.18
        shell: bash
        run: |
          set -euo pipefail
          VER=1.18.0
          curl -sSL -o /tmp/doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/Release_${VER//./_}/doxygen-${VER}.linux.bin.tar.gz"
          sudo tar xzf /tmp/doxygen.tar.gz -C /opt
          sudo ln -sf "/opt/doxygen-${VER}/bin/doxygen" /usr/local/bin/doxygen
          doxygen --version

      - name: test-doxygen
        shell: bash
        run: |
          make test-doxygen

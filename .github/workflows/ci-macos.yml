name: ci-macos

# Infra v3 platform gate for macOS (migrated from the legacy `make test`
# matrix; see docs/engineering/testing-infra-v3.md). Runs the mac-nightly
# profile (3 registry cells: macos-15/macos-26-intel Release, xcode-27 Debug,
# CXX on) with the full ctest scope.
#
# The legacy `make check`/`test` also invoked `test-stochastic`
# (multi-process mdbx_test, 600s), unstable since the TASK-43 port
# (bad75821) — DB grows into MDBX_MAP_FULL / MDBX_UNABLE_EXTEND_MAPSIZE.
# Stochastic coverage is owned by the nightly full-scope gates of the
# platform workflows (including this one).

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    - cron: "47 0 * * *"
      timezone: "Europe/Moscow"
  workflow_dispatch:
  # Agent fan-out signal (shared with ci-dispatch): payload {ref} is
  # honored by the resolve step; a bare event runs the nightly profile
  # against the default ref (see the EVENT_REF consumption below).
  repository_dispatch:
    types: [dispatch-event]

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      cells: ${{ steps.resolve.outputs.cells }}
      ref: ${{ steps.resolve.outputs.ref }}
      scope: ${{ steps.resolve.outputs.scope }}
      nightly: ${{ github.event_name == 'schedule' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
      - name: resolve cells
        id: resolve
        shell: bash
        env:
          EVENT_REF: ${{ github.event.client_payload.ref }}
          # workflow_dispatch fires with github.ref = the dispatched branch:
          # honor it, so a UI/API dispatch on a branch builds THAT branch
          # (the bare master fallback only applies to the schedule and to a
          # bare repository_dispatch).
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CELLS=$(tests/ci/select-cells.py --profile mac-nightly)
          REF="${EVENT_REF:-${GITHUB_REF_NAME:-master}}"
          JSON=$(tests/ci/resolve-cells.py "$CELLS" full 2> >(sed 's/^/==> /' >&2) || { echo "resolve-cells failed" >&2; exit 1; })
          echo "cells=${JSON}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "scope=full" >> "$GITHUB_OUTPUT"

  run:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.cells) }}
    uses: ./.github/workflows/ci-run.yml
    with:
      cell: ${{ matrix.cell }}
      "runs-on": ${{ matrix.runs-on }}
      scope: ${{ matrix.scope }}
      coverage: ${{ matrix.coverage }}
      ndk: ${{ matrix.ndk }}
      ref: ${{ needs.resolve.outputs.ref }}
      nightly: ${{ needs.resolve.outputs.nightly == 'true' }}
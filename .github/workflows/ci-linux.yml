name: ci-linux

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  # The trimmed gate set runs for pull requests (whatever their base is,
  # hence no branches filter here), for pushes to this maintenance branch,
  # and on the daily schedule (the nightly coverage). A new push to a PR
  # head - including a force-push - cancels the previous run of this
  # workflow via the concurrency group above.
  pull_request:
  push:
    branches: [stable]
  workflow_dispatch:
  schedule:
    - cron: "42 3 * * *"
      timezone: "Europe/Moscow"
  repository_dispatch:
    types: [dispatch-event]

jobs:
  ci-job:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            build-type: Debug
            cxx: ON
          - os: ubuntu-24.04
            build-type: Debug
            cxx: OFF
          - os: ubuntu-24.04
            build-type: Release
            cxx: ON
          - os: ubuntu-24.04
            build-type: Release
            cxx: OFF
          - os: ubuntu-26.04-arm
            build-type: Release
            cxx: ON
          - os: ubuntu-24.04
            build-type: RelWithDebInfo
            cxx: ON
            # The sanitizer build skips LTO (as on master): GCC's LTO-stage
            # stringop-overflow false positive in dxb.c meta_tap handling
            # breaks the -Werror link otherwise.
            extra-options: "|-DENABLE_ASAN:BOOL=ON|-DINTERPROCEDURAL_OPTIMIZATION=OFF"
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: true
    - name: ci-step
      shell: bash
      run: |
        export CI_MAKE_TARGET=$(if [ "$(uname)" = 'Linux' ]; then echo 'check'; elif [ "${{ matrix.build-type }}" != 'Debug' ]; then echo 'test'; else echo 'smoke'; fi) && \
        export MDBX_BUILD_OPTIONS=$(if [ "${{ matrix.build-type }}" = 'Debug' ]; then echo '-DMDBX_CHECKING=2 -DMDBX_DEBUG=1'; else echo '-DMDBX_CHECKING=0 -DMDBX_DEBUG=0'; fi) && \
        export MDBX_BUILD_CXX=$(if [ "${{ matrix.cxx }}" = 'ON' ]; then echo 'YES'; else echo 'NO'; fi) && \
        . tests/ci/ci.sh "-DCMAKE_BUILD_TYPE=${{ matrix.build-type }}|-DMDBX_BUILD_CXX:BOOL=${{ matrix.cxx }}${{ matrix.extra-options }}"

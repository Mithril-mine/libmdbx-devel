name: ci-linux

# Infra v3 platform gate for Linux (migrated from the legacy `make check`
# matrix; see docs/engineering/testing-infra-v3.md). Runs the linux-nightly
# profile (11 registry cells: ubuntu-24.04 + ubuntu-26.04-arm Debug/Release
# diagonals, the clang surface and profgc cells, the AddressSanitizer and
# UBSan gates, and the MDBX_LOCKING flavors) with the full ctest scope.
#
# The legacy `make check` also invoked `test-stochastic` (multi-process
# mdbx_test, 600s), which has been unstable since the TASK-43 port
# (bad75821): with an explicit --duration the default nops=1000 bound no
# longer truncates runs, so the DB grows into MDBX_MAP_FULL /
# MDBX_UNABLE_EXTEND_MAPSIZE. Stochastic coverage is owned by the nightly
# full-scope gates of the platform workflows (including this one).
#
# dist/amalgamation check (the former `make check` -> `dist install`) is
# kept as a dedicated job below.

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    - cron: "42 0 * * *"
      timezone: "Europe/Moscow"
  workflow_dispatch:
  # Agent fan-out signal (shared with ci-dispatch): payload {ref} is
  # honored by the resolve step; a bare event runs the nightly profile
  # against the default ref (see the EVENT_REF consumption below).
  repository_dispatch:
    types: [dispatch-event]

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      cells: ${{ steps.resolve.outputs.cells }}
      ref: ${{ steps.resolve.outputs.ref }}
      scope: ${{ steps.resolve.outputs.scope }}
      nightly: ${{ github.event_name == 'schedule' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
      - name: resolve cells
        id: resolve
        shell: bash
        env:
          EVENT_REF: ${{ github.event.client_payload.ref }}
          # workflow_dispatch fires with github.ref = the dispatched branch:
          # honor it, so a UI/API dispatch on a branch builds THAT branch
          # (the bare master fallback only applies to the schedule and to a
          # bare repository_dispatch).
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CELLS=$(tests/ci/select-cells.py --profile linux-nightly)
          REF="${EVENT_REF:-${GITHUB_REF_NAME:-master}}"
          JSON=$(tests/ci/resolve-cells.py "$CELLS" full 2> >(sed 's/^/==> /' >&2) || { echo "resolve-cells failed" >&2; exit 1; })
          echo "cells=${JSON}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "scope=full" >> "$GITHUB_OUTPUT"

  run:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.cells) }}
    uses: ./.github/workflows/ci-run.yml
    with:
      cell: ${{ matrix.cell }}
      "runs-on": ${{ matrix.runs-on }}
      scope: ${{ matrix.scope }}
      coverage: ${{ matrix.coverage }}
      ndk: ${{ matrix.ndk }}
      ref: ${{ needs.resolve.outputs.ref }}
      nightly: ${{ needs.resolve.outputs.nightly == 'true' }}

  dist:
    # Amalgamation gate: `make dist` must produce the tarball and the
    # amalgamated dist/ sources with no dev-only leftovers (probe-bus,
    # skynet/, etc.). Mirrors the former `make check` -> `dist install` leg.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          # The payload ref for the dispatch-event fan-out; github.ref for
          # schedule (the default branch) and workflow_dispatch (the
          # dispatched branch).
          ref: ${{ github.event.client_payload.ref || github.ref }}
      - name: dist-amalgamation
        shell: bash
        run: |
          set -euo pipefail
          make dist V=1
          # dist must stay free of the dev-only probe-bus implementation:
          # real mprobe_* entry points, the MDBX_PROBES build define and any
          # dist-cutoff markers. The no-op MPROBE_COLLECT/WATCH/FAULT fallbacks
          # in mdbx-internals.h are intentional (keep dist compiling).
          if grep -nE "mprobe_(ctl|fault|alloc|realloc|fire|is_active|reg_lock)|define MDBX_PROBES|dist-cutoff" \
              dist/mdbx.c dist/mdbx.h dist/mdbx.c++ dist/mdbx.h++ dist/mdbx-internals.h; then
            echo "ERROR: probe-bus/dev leftovers leaked into the amalgamated dist/" >&2
            exit 1
          fi
          test -f libmdbx-sources-*.tar.gz
          echo "dist OK"
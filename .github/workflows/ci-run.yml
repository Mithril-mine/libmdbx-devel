name: ci-run

# Infra v3 reusable single-cell runner (Testing Infrastructure v3, see
# .skynet/plans/testing-infra-v3-plan.md). Runs exactly one registry cell
# (tests/ci/config.json): configure + build + ctest with the fast/full scope,
# uploads metrics + fault artifacts on failure. No ci.sh involved.
#
# Callers: ci-dispatch.yml (push / schedule / dispatch), or ad-hoc
# workflow_dispatch with an explicit cell id.
#
# All cell fields (runs-on/env/cmake/build_only) are read from
# tests/ci/config.json inside the checked-out ref — single source of truth.

on:
  workflow_call:
    inputs:
      cell:
        type: string
        required: true
        description: Registry cell id (tests/ci/config.json)
      ref:
        type: string
        required: false
        default: ''
        description: "Ref to check out (default: calling workflow's ref)"
      scope:
        type: string
        required: false
        default: fast
        description: 'ctest scope: fast (smoke-t1|ut.* minus heavy) or full'
      "runs-on":
        type: string
        required: true
        description: Runner label (resolved by the orchestrator from the registry)
      coverage:
        type: boolean
        required: false
        default: false
        description: Build with ENABLE_GCOV and upload an lcov report
      ndk:
        type: string
        required: false
        default: ''
        description: Android NDK version for android cells (empty for non-android)

permissions:
  contents: read

jobs:
  cell:
    runs-on: ${{ inputs.runs-on }}
    env:
      CI_CTEST_TIMEOUT: "600"
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          ref: ${{ inputs.ref || github.sha }}

      - name: ensure ccache
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            echo "ccache already present: $(ccache --version | head -1)"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          elif command -v brew >/dev/null 2>&1; then
            brew install ccache >/dev/null
          elif command -v choco >/dev/null 2>&1; then
            choco install -y ccache
            echo "$(cygpath -u "$(dirname "$(command -v ccache)")")" >> "$GITHUB_PATH"
          fi
          if command -v ccache >/dev/null 2>&1; then
            echo "ccache ready: $(ccache --version | head -1)"
          else
            echo "ccache NOT available on this runner"
          fi

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ inputs.cell }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.cell }}-

      - name: setup Android NDK
        if: ${{ inputs.ndk != '' }}
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ inputs.ndk }}
          add-to-path: true

      - name: ensure ninja (android)
        if: ${{ inputs.ndk != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v ninja >/dev/null 2>&1; then
            echo "ninja already present: $(ninja --version)"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          elif command -v brew >/dev/null 2>&1; then
            brew install ninja >/dev/null
          fi
          command -v ninja && ninja --version || echo "ninja NOT available"

      - name: configure + build + ctest (fast/full scope)
        shell: bash
        env:
          # LTO stays off in test builds (skynet/build.md §6.7). ccache is
          # enabled with an actions/cache-backed CCACHE_DIR so warm hits carry
          # across runs of the same cell (the ephemeral hosted runner discards
          # everything between jobs otherwise). Coverage cells skip ccache:
          # gcov's .gcno/.gcda are not restored on cache hits.
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 300M
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          EXTRA="-DINTERPROCEDURAL_OPTIMIZATION=OFF"
          if [ "${{ inputs.coverage }}" != "true" ] && command -v ccache >/dev/null 2>&1; then
            EXTRA="$EXTRA -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          export RUN_CELL_EXTRA_CMAKE="$EXTRA"
          tests/ci/run-cell.py "${{ inputs.cell }}" --scope "${{ inputs.scope }}" \
            --build-dir @ci-cmake-build 2>&1

      - name: coverage report
        if: ${{ inputs.coverage }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD="@ci-cmake-build"
          ROOT="$(pwd)"
          if ! command -v lcov >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          fi
          rm -rf coverage
          mkdir -p coverage
          # GCC emits negative counts and end-line mismatches for the
          # instrumented test binaries; lcov 2.x needs explicit ignore-errors.
          lcov --capture --directory "$BUILD" --output-file coverage/lines.info \
            --quiet --ignore-errors negative,mismatch \
            --include "$ROOT/src/*"
          lcov --summary coverage/lines.info 2>&1 | tail -6
          genhtml coverage/lines.info --output-directory coverage/html \
            --legend --quiet --title "libmdbx devel (${{ inputs.cell }})"

      - name: upload coverage report
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.cell }}
          path: coverage
          if-no-files-found: ignore

      - name: upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell-metrics-${{ inputs.cell }}
          path: '@ci-cmake-build/Testing/Temporary/cell-metrics.json'
          if-no-files-found: ignore

      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cell-failure-${{ inputs.cell }}
          path: |
            @ci-cmake-build/Testing/Temporary/LastTest.log
            @ci-cmake-build/Testing/Temporary/cell-metrics.json
          if-no-files-found: ignore
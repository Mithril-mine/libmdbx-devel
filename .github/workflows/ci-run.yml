name: ci-run

# Reusable single-cell runner (TASK-28 stage 11).
# Called by ci-dispatch.yml with one resolved cell; builds + tests one exact
# configuration against the requested ref. Pure CMake/CTest, no ci.sh.

on:
  workflow_call:
    inputs:
      runs-on:
        description: runner label for this cell (from the registry)
        required: true
        type: string
      cell-id:
        description: cell id from tests/ci/config.json
        required: true
        type: string
      cell-env:
        description: toolchain env as newline-separated KEY=VALUE lines
        required: false
        type: string
        default: ""
      cell-cmake:
        description: cmake configure args (space-separated)
        required: true
        type: string
      cell-build-config:
        description: build configuration for multi-config generators (--config)
        required: false
        type: string
        default: ""
      cell-ctest-regex:
        description: ctest -R regex (empty = default set)
        required: false
        type: string
        default: ""
      cell-ctest-exclude:
        description: ctest -E regex (empty = none)
        required: false
        type: string
        default: ""
      cell-build-only:
        description: 'true = build only, skip ctest'
        required: false
        type: boolean
        default: false
      ref:
        description: git ref (branch or SHA) to test
        required: true
        type: string
      repo:
        description: repository to check out
        required: false
        type: string
        default: ${{ github.repository }}

permissions:
  contents: read

env:
  CI: GITHUB

jobs:
  cell:
    name: ${{ inputs.cell-id }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: export toolchain env
        if: inputs.cell-env != ''
        shell: bash
        run: |
          printf '%s\n' '${{ inputs.cell-env }}' >> "$GITHUB_ENV"

      - name: configure
        shell: bash
        run: |
          set -euxo pipefail
          if command -v ninja >/dev/null 2>&1; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/@ci-cmake-build" $GEN ${{ inputs.cell-cmake }}

      - name: build
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_ARGS=(--build "$GITHUB_WORKSPACE/@ci-cmake-build" --parallel)
          if [ -n "${{ inputs.cell-build-config }}" ]; then
            BUILD_ARGS+=(--config '${{ inputs.cell-build-config }}')
          fi
          cmake "${BUILD_ARGS[@]}"

      - name: test
        if: ${{ ! inputs.cell-build-only }}
        shell: bash
        env:
          GTEST_SHUFFLE: "1"
          GTEST_RUNTIME_LIMIT: "99"
          MALLOC_CHECK_: "7"
          MALLOC_PERTURB_: "42"
        run: |
          set -euxo pipefail
          CTEST_CMD=(ctest --test-dir "$GITHUB_WORKSPACE/@ci-cmake-build" \
            --output-on-failure --parallel 3 --schedule-random --no-tests=error)
          if [ -n "${{ inputs.cell-ctest-regex }}" ]; then
            CTEST_CMD+=(-R '${{ inputs.cell-ctest-regex }}')
          fi
          if [ -n "${{ inputs.cell-ctest-exclude }}" ]; then
            CTEST_CMD+=(-E '${{ inputs.cell-ctest-exclude }}')
          fi
          "${CTEST_CMD[@]}"

      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cell-${{ inputs.cell-id }}
          if-no-files-found: ignore
          path: |
            @ci-cmake-build/Testing/Temporary/LastTest.log
            **/fault.db*
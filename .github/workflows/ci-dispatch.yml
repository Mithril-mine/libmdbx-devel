name: ci-dispatch

# Infra v3 orchestrator (Testing Infrastructure v3, see
# .skynet/plans/testing-infra-v3-plan.md).
#
# Triggers:
#   push        -> change-addressed cells (diff vs previous commit, capped to
#                  CI_PUSH_CAP, fast scope). Branches: devel, master.
#   (no schedule: nightly ownership belongs to the per-platform workflows
#   ci-linux/ci-windows/ci-macos/ci-android; this dispatcher is the push gate
#   and the manual/agent entry point for profiles/cells.)
#   workflow_dispatch -> single cell or named profile on any ref (owner UI).
#   repository_dispatch -> {profile|cell, ref} for agents; a bare event (no
#                          payload) falls back to the push-quick profile so
#                          sibling workflows sharing dispatch-event stay usable.
#
# Each selected cell fans out to the reusable ci-run.yml which runs the exact
# registry entry (tests/ci/config.json) with --scope fast/full.
#
# NOTE: repository_dispatch/schedule fire only from the default branch, so this
# workflow must live on master before agents/nightly can use it (design §3).

concurrency:
  # Separate the push-run (compact push-quick gate) from the pull_request-run
  # (change-addressed gate): a push to a branch that also has a PR must trigger
  # BOTH — the PR cells are what actually gate the change on the full Windows
  # axis matrix, and sharing one cancel-in-progress group would silently drop
  # one of the runs.
  group: ci-dispatch-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  # Push on ANY branch runs the compact push-quick gate (CI v3.5): a breakage
  # in common code (src/, CMakeLists.txt, mdbx.h, .github/...) must be caught on
  # feature branches too, not only after merge. The nightly 190-cell full gate
  # still owns repeated stochastic coverage on master via the platform workflows.
  push:
    branches: ['**']
  pull_request:
    branches: [devel, master]
  workflow_dispatch:
    inputs:
      cell:
        type: string
        required: false
        default: ""
        description: Registry cell id to run (tests/ci/config.json)
      profile:
        type: string
        required: false
        default: "push-quick"
        description: Registry profile name (default push-quick)
      scope:
        type: string
        required: false
        default: fast
        description: ctest scope (fast/full)
  repository_dispatch:
    types: [dispatch-event]

jobs:
  validate-config:
    # Guarantee the registry is consistent and the change-addressed gate covers
    # the full axis matrix (CI v3.5, see tests/ci/validate-config.py). A
    # failure here blocks the whole dispatch, including nightly.
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
      - name: validate structure + coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ci/validate-config.py check-structure
          python3 tests/ci/validate-config.py check-coverage

  resolve:
    needs: validate-config
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.resolve.outputs.cells }}
      ref: ${{ steps.resolve.outputs.ref }}
      scope: ${{ steps.resolve.outputs.scope }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: resolve cells
        id: resolve
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          EVENT_PROFILE: ${{ github.event.inputs.profile || github.event.client_payload.profile }}
          EVENT_CELL: ${{ github.event.inputs.cell || github.event.client_payload.cell }}
          EVENT_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref }}
          EVENT_SCOPE: ${{ github.event.inputs.scope || github.event.client_payload.scope }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          SCOPE="${EVENT_SCOPE:-fast}"
          REF=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Change-addressed gate: select by diff against the merge base.
              # Common-code changes get union(push-quick, win-gate); docs-only
              # get the compact push-quick. Fall back to the FULL change-addressed
              # gate (never just push-quick) if the base is unavailable or the
              # diff cannot be resolved: under a PR the safer direction is more
              # coverage, not less.
              echo "==> pull_request: change-addressed gate on the PR head"
              BASE="${PR_BASE_SHA:-${GITHUB_REF}}"
              # The PR-base commit may not be present in the shallow fetch of the
              # head ref; ensure it is available so the diff-selection works
              # (fallback = full change-addressed gate if the fetch still fails).
              git fetch origin "$BASE" || true
              CELLS=$(tests/ci/select-cells.py --base "$BASE" || tests/ci/select-cells.py --profile change-addressed)
              SCOPE=fast
              REF="${PR_HEAD_SHA:-${GITHUB_REF}}"
              ;;
            push)
              # Push on ANY branch runs the change-addressed gate: diff against
              # the previous commit selects union(push-quick, win-gate) for
              # common-code changes and the compact push-quick for docs-only
              # ones. This is what ensures a push to a feature branch (e.g. a
              # Windows-breaking src/ change) runs the full Windows axis matrix
              # even when no PR run is created.
              echo "==> push: change-addressed gate on $GITHUB_REF"
              BASE="${PUSH_BEFORE:-${GITHUB_REF}}"
              if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
                BASE="${GITHUB_REF}"
              fi
              git fetch origin "$BASE" 2>/dev/null || true
              CELLS=$(tests/ci/select-cells.py --base "$BASE" || tests/ci/select-cells.py --profile push-quick)
              REF="$GITHUB_REF"
              ;;
            schedule)
              echo "==> schedule: nightly full on master"
              # Nightly marker: enables GTEST_SHUFFLE=1 (random gtest order)
              # in tests/ci/run-cell.py, so a different subset of the suite
              # runs each night under the GTEST_RUNTIME_LIMIT soft deadline.
              export CI_NIGHTLY=1
              echo "CI_NIGHTLY=1" >> "$GITHUB_ENV"
              CELLS=$(tests/ci/select-cells.py --profile full)
              SCOPE=full
              REF="master"
              ;;
            repository_dispatch)
              PROF="${EVENT_PROFILE:-}"
              CID="${EVENT_CELL:-}"
              REF="${EVENT_REF:-}"
              if [ -n "$CID" ]; then
                echo "==> dispatch: single cell $CID @ $REF"
                CELLS="$CID"
              elif [ -n "$PROF" ]; then
                echo "==> dispatch: profile $PROF @ $REF"
                CELLS=$(tests/ci/select-cells.py --profile "$PROF")
              else
                # Bare dispatches (no profile/cell payload) fall back to the
                # push-quick gate instead of failing resolve: other workflows
                # sharing the dispatch-event trigger (e.g. ci-windows) consume
                # the event too, so a bare event is a legitimate signal.
                echo "==> dispatch: no profile/cell, falling back to push-quick"
                CELLS=$(tests/ci/select-cells.py --profile push-quick)
              fi
              ;;
            workflow_dispatch)
              PROF="${EVENT_PROFILE:-push-quick}"
              CID="${EVENT_CELL:-}"
              REF="${EVENT_REF:-${GITHUB_REF}}"
              if [ -n "$CID" ]; then
                echo "==> workflow_dispatch: single cell $CID @ $REF"
                CELLS="$CID"
              else
                echo "==> workflow_dispatch: profile $PROF @ $REF"
                CELLS=$(tests/ci/select-cells.py --profile "$PROF")
              fi
              ;;
            *)
              echo "dispatch-error: unsupported event $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          # Build the matrix rows: [{cell, runs-on, scope}] resolved from the registry.
          JSON=$(tests/ci/resolve-cells.py "$CELLS" "$SCOPE" 2> >(sed 's/^/==> /' >&2) || { echo "resolve-cells failed" >&2; exit 1; })
          echo "cells=${JSON}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"

  run:
    needs: resolve
    if: ${{ needs.resolve.outputs.cells != '[]' && needs.resolve.outputs.cells != '' }}
    strategy:
      fail-fast: false
      # Throttle the number of concurrently-spawned cells: launching the whole
      # 149-cell win-full matrix at once overwhelmed the runner queue and
      # silently dropped jobs (empty steps, no metrics) as infra failures.
      max-parallel: 40
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.cells) }}
    uses: ./.github/workflows/ci-run.yml
    with:
      cell: ${{ matrix.cell }}
      "runs-on": ${{ matrix.runs-on }}
      scope: ${{ matrix.scope }}
      coverage: ${{ matrix.coverage }}
      ndk: ${{ matrix.ndk }}
      ref: ${{ needs.resolve.outputs.ref }}

  dist:
    name: dist (linux)
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
      - name: make dist
        shell: bash
        run: |
          set -euo pipefail
          make dist V=1
      - name: check dist archive
        shell: bash
        run: |
          set -euo pipefail
          DIST_TARBALL=$(ls libmdbx-sources-*.tar.gz 2>/dev/null || true)
          if [ -z "$DIST_TARBALL" ]; then
            echo "dist tarball (libmdbx-sources-*.tar.gz) not produced" >&2
            exit 1
          fi
          echo "dist archive ok: $DIST_TARBALL"
name: ci-dispatch

# Infra v3 orchestrator (Testing Infrastructure v3, see
# docs/engineering/testing-infra-v3.md).
#
# Triggers:
#   push        -> change-addressed cells (diff vs the nearest successful
#                  base run, fast scope). Branches: devel, master — a feature
#                  branch with an open PR is covered by its pull_request run
#                  (firing both for the same branch made the runs supersede
#                  each other, and the cancelled duplicate surfaced as red
#                  checks on the PR); a branch without a PR can be gated on
#                  demand via workflow_dispatch/repository_dispatch.
#   schedule    -> the weekly coverage export: the `coverage` profile (the
#                  three codecov-report cells) with the full test scope. The
#                  only scheduled job here — the nightlies belong to the
#                  per-platform workflows (ci-linux/ci-windows/ci-macos/
#                  ci-android), and the coverage cells are deliberately kept
#                  out of them (the instrumented Debug builds are too costly
#                  to repeat daily).
#   workflow_dispatch -> single cell or named profile on any ref (owner UI).
#   repository_dispatch -> {profile|cell, ref} for agents; a bare event (no
#                          payload) falls back to the push-quick profile so
#                          sibling workflows sharing dispatch-event stay usable.
#
# Each selected cell fans out to the reusable ci-run.yml which runs the exact
# registry entry (tests/ci/config.json) with --scope fast/full.
#
# NOTE: repository_dispatch fires only from the default branch, so this
# workflow must live on master before agents can use it (design §3).

# No native concurrency group: the orchestrator (tests/ci/orchestrate.py) is the
# sole owner of run cancellation/dedup. A native cancel-in-progress group would
# blindly cancel queued/just-started runs on every new event of the same branch
# (even when the orchestrator intended to keep or skip them), losing coverage.

permissions:
  actions: write
  contents: read

on:
  # Push on the main lines runs the compact push-quick gate (CI v3.5). A
  # feature branch with an open pull request is covered by its pull_request
  # run below — firing both for the same branch made the runs supersede each
  # other, and the cancelled duplicate surfaced as red checks on the PR.
  # A branch without a PR can be gated on demand via workflow_dispatch or
  # repository_dispatch. The repeated stochastic coverage on master belongs to
  # the nightly full-scope gates of the platform workflows
  # (ci-linux/ci-windows/ci-macos/ci-android).
  push:
    branches: [devel, master]
  # No branches filter here, deliberately: a PR temporarily retargeted to a
  # non-main base (stacked integrations) silently lost its whole gate — the
  # filter stopped matching, the sibling unfiltered workflows kept running,
  # and the base's automatic return fired no event to revive the matrix
  # (PR #492). The gate must follow the PR, whatever its current base is.
  pull_request:
  schedule:
    # Weekly (Sunday) coverage export: the `coverage` profile cells build with
    # the gcov/LLVM instrumentation and upload the reports to codecov.io
    # (see the resolve step and the ci-run.yml coverage legs).
    - cron: "0 4 * * 0"
      timezone: "Europe/Moscow"
  workflow_dispatch:
    inputs:
      cell:
        type: string
        required: false
        default: ""
        description: Registry cell id to run (tests/ci/config.json)
      profile:
        type: string
        required: false
        default: "push-quick"
        description: Registry profile name (default push-quick)
      scope:
        type: string
        required: false
        default: fast
        description: ctest scope (fast/full)
      codecov:
        type: boolean
        required: false
        default: false
        description: >-
          Upload the coverage reports of the coverage-profile cells to
          codecov.io (the upload quota is limited; without this flag the
          dispatch runs the cells and keeps the reports in the artifacts
          only)
  repository_dispatch:
    types: [dispatch-event]

jobs:
  validate-config:
    # Guarantee the registry is consistent and the change-addressed gate covers
    # the full axis matrix (CI v3.5, see tests/ci/validate-config.py). A
    # failure here blocks the whole dispatch, including nightly.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
      - name: validate structure + coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ci/validate-config.py check-structure
          python3 tests/ci/validate-config.py check-coverage

  clang-format:
    # Enforce the AGENTS.md §8 "run clang-format before publishing" rule on
    # every commit: the tracked C/C++ sources must conform to the repository
    # .clang-format style. On violations the job prints the corrective patch.
    # The style is version-robust; the binary is pinned for deterministic
    # rendering.
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install the pinned clang-format
        run: |
          python3 -m venv .cf-venv
          .cf-venv/bin/pip install --quiet clang-format==21.1.8
          echo "$GITHUB_WORKSPACE/.cf-venv/bin" >> "$GITHUB_PATH"
      - name: check formatting
        shell: bash
        run: |
          set -euo pipefail
          tests/ci/check-clang-format.sh

  resolve:
    needs: [validate-config, clang-format]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      cells: ${{ steps.resolve.outputs.cells }}
      ref: ${{ steps.resolve.outputs.ref }}
      scope: ${{ steps.resolve.outputs.scope }}
      codecov-upload: ${{ steps.resolve.outputs.codecov-upload }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: resolve cells
        id: resolve
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          EVENT_PROFILE: ${{ github.event.inputs.profile || github.event.client_payload.profile }}
          EVENT_CELL: ${{ github.event.inputs.cell || github.event.client_payload.cell }}
          EVENT_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref }}
          EVENT_SCOPE: ${{ github.event.inputs.scope || github.event.client_payload.scope }}
          EVENT_CODECOV: ${{ github.event.inputs.codecov || github.event.client_payload.codecov }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Bare branch name for the Actions API `branch=` filter: head_ref is
          # bare on PRs, ref_name is bare on pushes (github.ref would carry the
          # refs/heads/ prefix and silently match no runs at all).
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCOPE="${EVENT_SCOPE:-fast}"
          REF=""
          # The codecov upload is opt-in (the codecov.io upload quota is
          # limited): the weekly schedule uploads, and so do the explicit
          # dispatches that set the codecov flag; the PR and push gates
          # never upload, even when they happen to select a coverage cell.
          CODECOV_UPLOAD=false
          case "$GITHUB_EVENT_NAME" in
            schedule)
              CODECOV_UPLOAD=true
              ;;
            workflow_dispatch|repository_dispatch)
              if [ "${EVENT_CODECOV:-}" = "true" ]; then
                CODECOV_UPLOAD=true
              fi
              ;;
          esac
          # A change touching tests/ extends the fast scope with the
          # hygiene label (test_hygiene_check) for this run (issue-backed:
          # the check guards against leftover database files in the build
          # directory, see tests/CMakeLists.txt). */
          tests_changed() {
            local base="$1" head_sha="$2"
            if [ -z "$base" ] || [ -z "$head_sha" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              return 1
            fi
            git diff --name-only "$base" "$head_sha" 2>/dev/null | grep -q '^tests/'
          }
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Orchestrated gate: diff against the nearest successful base run
              # (last successful ci-dispatch on the base branch, anchored via
              # temporary ci-ok-* tags), cancelling superseded/rewritten runs on
              # this branch and deduplicating the same-SHA push run.
              echo "==> pull_request: orchestrator on the PR head"
              BASE_REF="${PR_BASE_REF:-origin/devel}"
              ORCH=$(tests/ci/orchestrate.py --repo "${{ github.repository }}" \
                --workflow-id "ci-dispatch.yml" \
                --token "$GITHUB_TOKEN" --head-ref "$HEAD_REF" \
                --head-sha "$PR_HEAD_SHA" --base-ref "$BASE_REF" \
                --event pull_request --run-id "$RUN_ID")
              echo "$ORCH"
              ORCH_SKIP=$(echo "$ORCH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skip"])')
              if [ "$ORCH_SKIP" = "True" ] || [ "$ORCH_SKIP" = "true" ]; then
                echo "==> pull_request: skipped (duplicate run on the same SHA)"
                CELLS="[]"
              else
                CELLS=$(echo "$ORCH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cells"])')
              fi
              SCOPE=fast
              if tests_changed "${PR_BASE_SHA}" "${PR_HEAD_SHA}"; then
                echo "==> pull_request: tests/ changed, adding the hygiene check"
                SCOPE="fast+hygiene"
              fi
              REF="${PR_HEAD_SHA:-${GITHUB_REF}}"
              ;;
            push)
              # Push on the main lines (the trigger is branches: [devel, master])
              # runs the orchestrated change-addressed gate: diff against the
              # nearest successful run of the base branch (origin/devel,
              # fallback origin/master). A feature-branch push does not fire
              # this workflow: the branch is covered by its pull_request gate,
              # or is gated on demand via repository_dispatch.
              echo "==> push: orchestrator on $GITHUB_REF"
              # Base branch for the diff anchor: prefer origin/master (the main
              # line whose successful runs are in the ancestry of most feature
              # branches); the orchestrator falls back to origin/devel and then
              # to the full gate.
              BASE_REF="${BASE_REF:-origin/master}"
              ORCH=$(tests/ci/orchestrate.py --repo "${{ github.repository }}" \
                --workflow-id "ci-dispatch.yml" \
                --token "$GITHUB_TOKEN" --head-ref "$HEAD_REF" \
                --head-sha "$PUSH_SHA" --base-ref "$BASE_REF" \
                --event push --run-id "$RUN_ID")
              echo "$ORCH"
              ORCH_SKIP=$(echo "$ORCH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skip"])')
              if [ "$ORCH_SKIP" = "True" ] || [ "$ORCH_SKIP" = "true" ]; then
                echo "==> push: skipped (duplicate run on the same SHA)"
                CELLS="[]"
              else
                CELLS=$(echo "$ORCH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cells"])')
              fi
              SCOPE=fast
              if tests_changed "${PUSH_BEFORE}" "${PUSH_SHA}"; then
                echo "==> push: tests/ changed, adding the hygiene check"
                SCOPE="fast+hygiene"
              fi
              REF="$GITHUB_REF"
              ;;
            repository_dispatch)
              PROF="${EVENT_PROFILE:-}"
              CID="${EVENT_CELL:-}"
              REF="${EVENT_REF:-}"
              if [ -n "$CID" ]; then
                echo "==> dispatch: single cell $CID @ $REF"
                CELLS="$CID"
              elif [ -n "$PROF" ]; then
                echo "==> dispatch: profile $PROF @ $REF"
                CELLS=$(tests/ci/select-cells.py --profile "$PROF")
              else
                # Bare dispatches (no profile/cell payload) fall back to the
                # push-quick gate instead of failing resolve: other workflows
                # sharing the dispatch-event trigger (e.g. ci-windows) consume
                # the event too, so a bare event is a legitimate signal.
                echo "==> dispatch: no profile/cell, falling back to push-quick"
                CELLS=$(tests/ci/select-cells.py --profile push-quick)
              fi
              ;;
            schedule)
              # The weekly coverage export (see the trigger comment): the
              # codecov-report cells on the default branch, full scope — the
              # fast scope strips exactly the test legs the coverage is
              # measured on.
              echo "==> schedule: the coverage profile (codecov export)"
              CELLS=$(tests/ci/select-cells.py --profile coverage)
              SCOPE=full
              REF="${GITHUB_REF_NAME:-master}"
              ;;
            workflow_dispatch)
              PROF="${EVENT_PROFILE:-push-quick}"
              CID="${EVENT_CELL:-}"
              REF="${EVENT_REF:-${GITHUB_REF}}"
              if [ -n "$CID" ]; then
                echo "==> workflow_dispatch: single cell $CID @ $REF"
                CELLS="$CID"
              else
                echo "==> workflow_dispatch: profile $PROF @ $REF"
                CELLS=$(tests/ci/select-cells.py --profile "$PROF")
              fi
              ;;
            *)
              echo "dispatch-error: unsupported event $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          # Build the matrix rows: [{cell, runs-on, scope}] resolved from the registry.
          # A literal "[]" (orchestrator skip) is passed through so the run job
          # is skipped instead of resolve-cells failing on an unknown id.
          if [ "$CELLS" = "[]" ]; then
            JSON="[]"
          else
            JSON=$(tests/ci/resolve-cells.py "$CELLS" "$SCOPE" 2> >(sed 's/^/==> /' >&2) || { echo "resolve-cells failed" >&2; exit 1; })
          fi
          echo "cells=${JSON}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
          echo "codecov-upload=${CODECOV_UPLOAD}" >> "$GITHUB_OUTPUT"

  run:
    needs: resolve
    if: ${{ needs.resolve.outputs.cells != '[]' && needs.resolve.outputs.cells != '' }}
    strategy:
      fail-fast: false
      # Throttle the number of concurrently-spawned cells: launching a whole
      # large matrix at once (the legacy win-full profile peaked at ~150 cells)
      # overwhelmed the runner queue and silently dropped jobs (empty steps,
      # no metrics) as infra failures.
      max-parallel: 40
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.cells) }}
    uses: ./.github/workflows/ci-run.yml
    with:
      cell: ${{ matrix.cell }}
      "runs-on": ${{ matrix.runs-on }}
      scope: ${{ matrix.scope }}
      coverage: ${{ matrix.coverage }}
      ndk: ${{ matrix.ndk }}
      ref: ${{ needs.resolve.outputs.ref }}
      codecov-upload: ${{ needs.resolve.outputs.codecov-upload == 'true' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dist:
    name: dist (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
      - name: make dist
        shell: bash
        run: |
          set -euo pipefail
          make dist V=1
      - name: check dist archive
        shell: bash
        run: |
          set -euo pipefail
          DIST_TARBALL=$(ls libmdbx-sources-*.tar.gz 2>/dev/null || true)
          if [ -z "$DIST_TARBALL" ]; then
            echo "dist tarball (libmdbx-sources-*.tar.gz) not produced" >&2
            exit 1
          fi
          echo "dist archive ok: $DIST_TARBALL"
      - name: upload amalgamated tarball
        uses: actions/upload-artifact@v7
        with:
          name: amalgamated-tarball
          path: libmdbx-sources-*.tar.gz
          if-no-files-found: error
name: ci-cxx-msvc

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  # See ci-linux.yml: the same gate for pull requests, for this branch
  # and for the nightly schedule.
  pull_request:
  push:
    branches: [stable]
  workflow_dispatch:
  schedule:
    - cron: "42 3 * * *"
      timezone: "Europe/Moscow"
  repository_dispatch:
    types: [dispatch-event]

permissions:
  contents: read

jobs:
  ci-job:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: v142
            cxx: 11
            target: x64
            build-type: Debug
            os: windows-2022
          - toolset: v142
            cxx: 20
            target: Win32
            build-type: Release
            os: windows-2022
          - toolset: v145
            cxx: 23
            target: x64
            build-type: Release
            os: windows-latest
          - toolset: v143
            cxx: 17
            target: ARM64
            build-type: Debug
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: true
    - name: ci-step
      env:
        CI_MAKE_TARGET: ""
        CI_CMAKE_TEST_COMMAND: true
        CXXSTD: "-std=gnu++${{ matrix.cxx }}"
      shell: bash
      run: |
        . tests/ci/ci.sh "-A|${{ matrix.target }}|-T|${{ matrix.toolset }}|-DCMAKE_BUILD_TYPE=${{ matrix.build-type }}|-DCMAKE_CXX_STANDARD=${{ matrix.cxx }}" \
          "--config|${{ matrix.build-type }}" "--build-config|${{ matrix.build-type }}"

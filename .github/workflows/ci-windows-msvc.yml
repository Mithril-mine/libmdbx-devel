name: ci-windows-msvc

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  # See ci-linux.yml: trimmed set on this branch only + nightly schedule.
  push:
    branches: [lts/0.13]
  workflow_dispatch:
  schedule:
    - cron: "42 3 * * *"
      timezone: "Europe/Moscow"
  repository_dispatch:
    types: [dispatch-event]

jobs:
  ci-job:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: v145
            target: x64
            build-type: Debug
            dll: ON
            without_crt: ON
            os: windows-latest
          - toolset: v145
            target: x64
            build-type: Release
            dll: OFF
            without_crt: OFF
            os: windows-latest
          - toolset: v143
            target: x64
            build-type: Debug
            dll: ON
            without_crt: OFF
            os: windows-latest
          - toolset: v143
            target: Win32
            build-type: Release
            dll: ON
            without_crt: OFF
            os: windows-latest
          - toolset: v143
            target: ARM64
            build-type: Debug
            dll: ON
            without_crt: OFF
            os: windows-11-vs2026-arm
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: true
    - name: ci-step
      env:
        CI_MAKE_TARGET: ""
      shell: bash
      run: |
        . test/ci/ci.sh "-A|${{ matrix.target }}|-T|${{ matrix.toolset }}|-DCMAKE_BUILD_TYPE=${{ matrix.build-type }}|-DMDBX_BUILD_SHARED_LIBRARY:BOOL=${{ matrix.dll }}|-DMDBX_WITHOUT_MSVC_CRT:BOOL=${{ matrix.without_crt }}" \
          "--config|${{ matrix.build-type }}" "--build-config|${{ matrix.build-type }}"

name: ci-tracing

# Managed/controlled testing instrumentation (mprobe): first-version smoke of the
# three macros on Linux (USDT + LTTng), Windows (ETW + Detours) and macOS.
# Lightweight: single cell, one test. Kept separate from ci-dispatch so the
# push-quick flow stays untouched; selection will be revisited with the
# methodology's probe-driven coverage.

on:
  push:
    branches: [devel, master]
  workflow_dispatch:

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-job:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true

    - name: deps (linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y liblttng-ust-dev systemtap-sdt-dev lttng-tools

    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - name: configure (linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cmake -S . -B @ci-tracing -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DMDBX_BUILD_TRACING=ON -DENABLE_SYSTEMTAP=ON -DENABLE_LTTNG=ON \
          -DINTERPROCEDURAL_OPTIMIZATION=OFF

    - name: configure (windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cmake -S . -B @ci-tracing -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DMDBX_BUILD_TRACING=ON -DINTERPROCEDURAL_OPTIMIZATION=OFF

    - name: configure (macos)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cmake -S . -B @ci-tracing -DCMAKE_BUILD_TYPE=Debug \
          -DMDBX_BUILD_TRACING=ON

    - name: build
      shell: bash
      run: |
        cmake --build @ci-tracing --target mprobe_test -j 4

    - name: test
      shell: bash
      run: |
        ctest --test-dir @ci-tracing -R mprobe_tracing --output-on-failure
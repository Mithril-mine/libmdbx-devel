name: ci-windows-mscl

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
  schedule:
    - cron: "42 3 * * *"
      timezone: "Europe/Moscow"
  repository_dispatch:
    types: [dispatch-event]

jobs:
  ci-job:
    strategy:
      fail-fast: false
      matrix:
        studio: [18]
        dll: [ON, OFF]
        without_crt: [ON, OFF]
        target: [x64, ARM64]
        build-type: [Debug, Release]
        os: [windows-latest, windows-11-vs2026-arm]
        exclude:
          - os: windows-latest
            target: ARM64
          - os: windows-11-vs2026-arm
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: true
    - name: ci-step
      env:
        CI_MAKE_TARGET: ""
      shell: bash
      run: |
        TEST_ARGS=""
        # B14+TASK-30: long stochastic single-process scenarios (smoke_sp_hill/nested, GNUmakefile-heritage,
        # --duration 100 --repeat 42) run ~13x slower on the ARM64 beta-runner and exceed the 60s CTest
        # timeout (hill ~546s, nested >600s at devel@ccc994bf). The T1 tiered-smoke twins (smoke_t1_hill/
        # smoke_t1_nested, TASK-22) also exceed it there. They are NOT true smoke; skip them on the ARM64
        # jobs until probes (B6) allow diagnosing them there. x64/Linux coverage is unaffected.
        if [ "${{ matrix.target }}" = 'Win32' ]; then export TARGET_BIN="bin"; else export TARGET_BIN="${{ matrix.target }}/bin"; fi
        if [ "${{ matrix.target }}" = 'ARM64' ]; then TEST_ARGS="-E|smoke_(sp|t1)_"; fi
        export STUDIO_CLANG_DIR="/c/Program Files/Microsoft Visual Studio/${{ matrix.studio }}/Enterprise/VC/Tools/Llvm/${TARGET_BIN}"
        export CC="${STUDIO_CLANG_DIR}/clang.exe" CXX="${STUDIO_CLANG_DIR}/clang++.exe"
        . tests/ci/ci.sh "-DCMAKE_BUILD_TYPE=${{ matrix.build-type }}|-DMDBX_BUILD_SHARED_LIBRARY:BOOL=${{ matrix.dll }}|-DMDBX_WITHOUT_MSVC_CRT:BOOL=${{ matrix.without_crt }}" \
          "--config|${{ matrix.build-type }}" "--build-config|${{ matrix.build-type }}|${TEST_ARGS}"

    - name: upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ci-${{ matrix.os }}-${{ matrix.build-type }}-cxx${{ matrix.cxx }}
        if-no-files-found: ignore
        path: |
          @ci-cmake-build/Testing/Temporary/LastTest.log
          @cmake-build/Testing/Temporary/LastTest.log
          **/fault.db*

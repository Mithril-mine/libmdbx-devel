name: ci-windows-mscl

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  # See ci-linux.yml: trimmed set on this branch only + nightly schedule.
  push:
    branches: [stable]
  workflow_dispatch:
  schedule:
    - cron: "42 3 * * *"
      timezone: "Europe/Moscow"
  repository_dispatch:
    types: [dispatch-event]

jobs:
  ci-job:
    strategy:
      fail-fast: false
      matrix:
        include:
          - studio: "18"
            target: x64
            build-type: Release
            dll: ON
            without_crt: OFF
            os: windows-latest
          - studio: "18"
            target: ARM64
            build-type: Debug
            dll: ON
            without_crt: OFF
            os: windows-11-vs2026-arm
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: true
    - name: ci-step
      env:
        CI_MAKE_TARGET: ""
      shell: bash
      run: |
        if [ "${{ matrix.target }}" = 'Win32' ]; then export TARGET_BIN="bin"; else export TARGET_BIN="${{ matrix.target }}/bin"; fi && \
        export STUDIO_CLANG_DIR="/c/Program Files/Microsoft Visual Studio/${{ matrix.studio }}/Enterprise/VC/Tools/Llvm/${TARGET_BIN}" && \
        export CC="${STUDIO_CLANG_DIR}/clang.exe" CXX="${STUDIO_CLANG_DIR}/clang++.exe" && \
        . tests/ci/ci.sh "-DCMAKE_BUILD_TYPE=${{ matrix.build-type }}|-DMDBX_BUILD_SHARED_LIBRARY:BOOL=${{ matrix.dll }}|-DMDBX_WITHOUT_MSVC_CRT:BOOL=${{ matrix.without_crt }}" \
          "--config|${{ matrix.build-type }}" "--build-config|${{ matrix.build-type }}"

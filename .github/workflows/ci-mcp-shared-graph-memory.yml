name: ci-mcp-shared-graph-memory

# Lightweight single-cell matrix for the shared-graph-memory Python module
# (skynet/MCP-shared-graph-memory). Pure CMake/CTest, no ci.sh: builds its own
# host libmdbx via CTest fixtures and runs only the module pytest suite
# (ctest -L mcp-shared-graph-memory). Not triggered on Android by design.

env:
  CI: GITHUB
  # glibc heap hardening for the module tests: freed chunks are filled with
  # ~MALLOC_PERTURB_ and allocation inconsistencies abort, so use-after-free
  # of the binding's marshalled buffers fails fast (see conftest.py for the
  # in-process mallopt() equivalent used by plain pytest runs).
  MALLOC_CHECK_: "7"
  MALLOC_PERTURB_: "42"
  # the pymalloc-level complement: cffi allocates its cdata through the raw
  # allocator, and the debug variant poisons freed blocks with 0xDD, so
  # use-after-free of a marshalled buffer reads poison instead of stale data
  PYTHONMALLOC: "debug"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  # Feature branches are covered by the pull_request trigger: a bare push
  # trigger would fire this workflow twice for a PR branch (push + PR share
  # the concurrency group), and the cancelled duplicate surfaces as red
  # checks on the PR.
  push:
    branches: [devel, master]
  pull_request:
  schedule:
    - cron: "42 0 * * *"
      timezone: "Europe/Moscow"
  repository_dispatch:
    types: [dispatch-event]

jobs:
  ci-job:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: true
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: deps
      run: python3 -m pip install --quiet cffi pytest pyyaml
    - name: configure
      shell: bash
      run: |
        PYEXE="$(command -v python3 || command -v python)"
        echo "Using python: $PYEXE"
        cmake -S . -B @ci-mcp-shared-graph-memory \
          -DCMAKE_BUILD_TYPE=Release -DMDBX_BUILD_CXX=OFF \
          -DMDBX_ENABLE_TESTS=OFF -DMDBX_BUILD_MCP_MEMORY=ON \
          -DINTERPROCEDURAL_OPTIMIZATION=OFF \
          -DPython3_EXECUTABLE="$PYEXE"
    - name: test
      shell: bash
      run: ctest --test-dir @ci-mcp-shared-graph-memory -L mcp-shared-graph-memory --output-on-failure

name: ci-special-builds

# Special libmdbx build configurations required by tests that cannot be
# exercised by the default library build: the System V IPC locking (issue 80
# regression + the osal_ftok passthrough check) and the raw fallocate() branch
# of osal_fsetsize() with the probe-bus; see
# tests/special-builds/README.md and its subdirectories.
# SysV IPC is POSIX and the fallocate() branch is Linux-only, so only Linux
# cells are run.

on:
  push:
    branches: [devel, master]
  pull_request:
  workflow_dispatch:

env:
  CI: GITHUB

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  locking-sysv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: configure
        shell: bash
        run: |
          cmake -S tests/special-builds/locking-sysv -B @ci-special-locking-sysv \
            -DCMAKE_BUILD_TYPE=Debug

      - name: build
        shell: bash
        run: |
          cmake --build @ci-special-locking-sysv -j 4

      - name: test
        shell: bash
        run: |
          ctest --test-dir @ci-special-locking-sysv --output-on-failure

  fallocate-range:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: configure
        shell: bash
        run: |
          cmake -S tests/special-builds/fallocate-range -B @ci-special-fallocate-range \
            -DCMAKE_BUILD_TYPE=Debug

      - name: build
        shell: bash
        run: |
          cmake --build @ci-special-fallocate-range -j 4

      - name: test
        shell: bash
        run: |
          ctest --test-dir @ci-special-fallocate-range --output-on-failure